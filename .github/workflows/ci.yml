name: CI

# Antes no existía ningún workflow: pre-commit, mypy, pylint y pytest-cov
# estaban configurados en el repo pero nada los ejecutaba automáticamente
# en cada push/PR, así que nada garantizaba que se respetaran de verdad.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Ejecutar pytest con cobertura
        run: pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias de lint/tipos
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint,test]"

      - name: mypy
        run: mypy --config-file=.mypy.ini src

      - name: black --check
        run: black --check src tests

      - name: pylint
        run: pylint --rcfile=.pylintrc src
