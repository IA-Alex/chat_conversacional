name: CI

# Antes no existía ningún workflow: pre-commit, mypy, pylint y pytest-cov
# estaban configurados en el repo pero nada los ejecutaba automáticamente
# en cada push/PR, así que nada garantizaba que se respetaran de verdad.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-lint:
    # Solo en PR: valida que cada commit nuevo siga Conventional Commits
    # (feat:/fix:/docs:/refactor:/test:/chore:/style:/perf:/build:/ci:/revert:),
    # la convención que CHANGELOG.md ya asume para trazabilidad (ISO/IEC/IEEE
    # 12207 §6.3.5) pero que hasta ahora nada exigía — mensajes como "Mensaje
    # del commit" pasaban sin que CI los rechazara.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Conventional Commits
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|style|perf|build|ci|revert)(\([a-z0-9_-]+\))?: .+'
          fallo=0
          while IFS= read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            if ! echo "$msg" | grep -qE "$pattern"; then
              echo "::error::Commit $sha no sigue Conventional Commits: \"$msg\""
              fallo=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $fallo

  test:
    runs-on: ubuntu-latest
    # Matriz reducida a los extremos soportados (min/max de
    # requires-python en pyproject.toml, ">=3.10,<3.14") en vez de las
    # 3.10/3.11/3.12 originales: con el servicio de Postgres y la
    # instalación de redis-server sumadas a cada corrida, mantener una
    # franja media (3.11) que no agrega cobertura real por encima de los
    # dos extremos ya cubiertos no vale casi 1.5x el tiempo total de CI.
    # Mantiene el target ~5 min.
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: la_santisima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Consumido por tests/infrastructure/test_repository_postgres.py.
      # PostgresConversationRepository crea su propio esquema (tabla
      # `messages`, CREATE TABLE IF NOT EXISTS) en __init__, así que el
      # servicio de Postgres solo necesita la base de datos vacía
      # (POSTGRES_DB de arriba) — no hace falta un paso de
      # migración/schema previo.
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/la_santisima_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar redis-server (para tests/infrastructure/test_rate_limit_redis.py)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
        # El test no usa un servicio de GitHub Actions: levanta su propio
        # redis-server efímero vía subprocess (ver el módulo de test),
        # solo necesita el binario disponible en PATH.

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,postgres,redis]"

      - name: Ejecutar pytest con cobertura
        run: pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias de lint/tipos
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint,test]"
          pip install pre-commit

      - name: Hooks de higiene de repo (pre-commit)
        # Hooks configurados en .pre-commit-config.yaml que ningún otro paso
        # de este workflow cubre (mypy/black/pylint corren aparte abajo, sin
        # duplicarlos aquí). check-added-large-files es el que hubiera
        # bloqueado los HTML de varios MB que llegaron a versionarse antes
        # de que este workflow existiera: pre-commit estaba configurado
        # pero nunca se ejecutaba en CI, solo si cada quien lo instalaba
        # localmente.
        run: |
          pre-commit run --all-files trailing-whitespace
          pre-commit run --all-files end-of-file-fixer
          pre-commit run --all-files check-yaml
          pre-commit run --all-files check-added-large-files
          pre-commit run --all-files prettier

      - name: mypy
        run: mypy --config-file=.mypy.ini src

      - name: black --check
        run: black --check src tests

      - name: pylint
        run: pylint --rcfile=.pylintrc src

      - name: Validar config y reglas de Prometheus
        # ``promtool`` no es un paquete de pip: es el binario que trae la
        # propia imagen de Prometheus. Se usa vía Docker (ya disponible en
        # el runner) en vez de descargar/compilar el binario aparte.
        run: |
          docker run --rm -v "$PWD/monitoring:/monitoring" prom/prometheus:latest \
            promtool check config /monitoring/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/monitoring" prom/prometheus:latest \
            promtool check rules /monitoring/prometheus_rules.yml
