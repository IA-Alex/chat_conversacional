[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

[mypy-crewai.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-langchain_core.*]
ignore_missing_imports = True

# redis y psycopg son extras opcionales (pip install -e ".[redis]" /
# ".[postgres]"), importados perezosamente dentro de LimitadorTasaRedis y
# PostgresConversationRepository precisamente para no forzar su instalación
# cuando esas funcionalidades están apagadas (ver Settings.usar_redis_rate_limit
# / usar_postgres). El job "quality" de CI instala solo ".[lint,test]", así
# que sin esto mypy fallaría aquí en cualquier entorno donde no estén
# instalados, aunque el resto del código sí tipe correctamente.
[mypy-redis.*]
ignore_missing_imports = True

[mypy-psycopg.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
