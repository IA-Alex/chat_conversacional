<style>
  :root {
    /* Escala de espaciado: toda separación vertical/horizontal del chat
       (gap entre mensajes, padding de contenedores, margen del timestamp)
       se expresa en estos tokens en vez de números sueltos, para que el
       ritmo visual sea el mismo sin importar cuántas líneas tenga cada
       mensaje. */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 16px;
    --space-4: 24px;
    --space-5: 32px;
    --space-6: 40px;
    --space-7: 64px;

    /* Namespace --cal-* (docs/ux-criterios-evaluacion.md SU-J2/SU-J5/SU-T2/SU-A4/UX-D1).
       Alcance de esta pasada: solo los puntos marcados en la auditoría (A1
       contraste de .msg-time, A3 medida de lectura, M6 escala tipográfica,
       B2 ritmo vertical). El resto de hex/rgba del archivo — fondo, niebla,
       imagen, y el bloque #consent-overlay marcado como "diseño literal
       entregado" — queda fuera de este cambio a propósito: tokenizarlo es
       un rediseño aparte, no parte de estos 4 hallazgos. */
    --cal-text-meta: #857e75;   /* 4.92:1 sobre #0b0a10, sin opacity */
    --cal-measure: 62ch;
    --cal-text-deity-size: 19px;
    --cal-text-user-size: 16px;
    --cal-text-meta-size: 10px;
    --cal-rhythm-message: 34px;
  }
  html, body { margin: 0; padding: 0; background: #0b0a10; }
  * { box-sizing: border-box; }
  ::selection { background: rgba(184,150,95,0.35); }

  /* Animan SOLO `translate` (propiedad independiente de `transform`, no el
     shorthand). Una animación CSS activa siempre gana sobre cualquier regla
     estática o estilo inline para la MISMA propiedad que anima — si esto
     tocara `transform` (o `scale`), el `scale(1.35)` de `.fog.intense` y el
     `el.style.scale` de triggerIntensifyWithEmocion jamás se verían,
     sin importar qué tan "gane" en especificidad: perderían siempre contra
     el fotograma activo de la animación. Verificado con getComputedStyle
     en vivo: antes de este cambio, el transform nunca superaba ~1.06 pase
     lo que pasara con la clase .intense. */
  @keyframes fogDriftA { 0% { translate: 0 0; } 50% { translate: 18px -14px; } 100% { translate: 0 0; } }
  @keyframes fogDriftB { 0% { translate: 0 0; } 50% { translate: -22px 16px; } 100% { translate: 0 0; } }
  @keyframes fogDriftC { 0% { translate: 0 0; } 50% { translate: 14px 20px; } 100% { translate: 0 0; } }

  #root { min-height: 100vh; width: 100%; display: flex; flex-direction: row; background: #0b0a10; overflow: hidden; }

  #image-panel { position: relative; overflow: hidden; width: 50%; height: 100vh; flex-shrink: 0; }
  #image-panel img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; filter: saturate(1.02) contrast(1.03); }
  #image-overlay { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(11,10,16,0.15) 0%, rgba(11,10,16,0.05) 40%, rgba(11,10,16,0.55) 100%); }
  #smoke-edge { position: absolute; top: 0; right: 0; bottom: 0; width: 38%; pointer-events: none;
    background: linear-gradient(90deg, rgba(11,10,16,0) 0%, rgba(14,12,18,0.5) 55%, rgba(11,10,16,0.88) 100%); }

  #chat-panel { position: relative; overflow: hidden; display: flex; flex-direction: column;
    background: rgba(13,11,17,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    width: 50%; height: 100vh; }

  .fog { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(14px); scale: 1;
    background: radial-gradient(circle, rgba(100,90,115,0.5) 0%, rgba(100,90,115,0) 72%);
    transition: scale 0.35s ease-out, opacity 0.35s ease-out, background 0.35s ease-out; }
  .fog.intense { scale: 1.35; opacity: 1; background: radial-gradient(circle, rgba(100,90,115,0.85) 0%, rgba(100,90,115,0) 72%); }
  @keyframes messageIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .fog { animation: none; }
    .msg-deity, .msg-user-row { animation: none; }
  }

  #messages { flex: 1; overflow-y: auto; padding: var(--space-7) var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--cal-rhythm-message); position: relative; z-index: 1; }

  .msg-deity { display: flex; flex-direction: column; align-items: flex-start; max-width: min(94%, var(--cal-measure)); animation: messageIn 0.32s ease-out; }
  .msg-deity .text { font-family: 'Crimson Pro', serif; font-weight: 500; font-size: var(--cal-text-deity-size); line-height: 1.55; color: #d3c8b6; text-align: left; }
  .msg-deity .text strong { font-weight: 700; color: #e8dcc8; }
  .msg-time { font-family: 'Crimson Pro', serif; font-size: var(--cal-text-meta-size); color: var(--cal-text-meta); margin-top: var(--space-2); letter-spacing: 0.04em; }

  .msg-user-row { display: flex; justify-content: flex-end; animation: messageIn 0.32s ease-out; }
  .msg-user-inner { display: flex; align-items: stretch; gap: var(--space-3); max-width: min(90%, var(--cal-measure)); }
  .msg-user-line { width: 1px; background: rgba(184,150,95,0.55); flex-shrink: 0; }
  .msg-user-col { display: flex; flex-direction: column; align-items: flex-end; }
  .msg-user-col .text { font-family: 'Crimson Pro', serif; font-weight: 400; font-size: var(--cal-text-user-size); line-height: 1.5; color: #c1c1c5; text-align: right; }

  /* alpha 0.3 -> 0.1: a esa intensidad la línea competía con el glow de
     foco de #chat-input (WCAG 2.4.7, ver más abajo) en el primer impacto
     visual, generando dos líneas doradas muy juntas justo donde debe caer
     la atención (el campo de texto). Se conserva atenuada solo como
     separación estructural sutil entre #messages y el input. */
  #input-row { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px;
    padding: 20px 56px 40px; border-top: 1px solid rgba(184,150,95,0.1); }
  #chat-input { flex: 1; background: transparent; border: none; outline: none;
    font-family: 'Crimson Pro', serif; font-style: normal; font-size: 16px; color: #e8dcc8; padding: 8px 0; }
  /* alpha 0.58, no 0.52: medido contra el fondo real renderizado
     (rgb(11,9,16), muestreado del chat-panel), 0.52 daba 4.49:1 —
     por debajo del mínimo 4.5:1 de WCAG 1.4.3 (texto normal) que el
     propio proyecto usa como referencia (ver --cal-text-meta arriba,
     "4.92:1 sobre #0b0a10"). 0.58 da ~5.3:1, con el mismo margen que
     ese otro texto secundario. */
  #chat-input::placeholder { color: rgba(232,220,200,0.58); }
  #send-btn, #stop-btn { background: none; border: none; padding: 11px; min-width: 44px; min-height: 44px; cursor: pointer; color: rgba(184,150,95,0.85);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #send-btn:hover, #stop-btn:hover { color: rgba(184,150,95,1); }
  #stop-btn[hidden] { display: none; }

  /* alpha 0.65, no 0.55: medido contra el fondo real renderizado
     (rgb(11,9,16)), 0.55 daba 2.85:1 — bajo el mínimo 3:1 de WCAG 1.4.11
     (contraste no textual) para un ícono funcional (no decorativo). 0.65
     da ~3.56:1. El estado :disabled queda exento (WCAG 1.4.11 no aplica
     a componentes inactivos). */
  #reset-btn { position: absolute; top: 14px; right: 14px; z-index: 2; background: none; border: none;
    padding: 9px; min-width: 40px; min-height: 40px; cursor: pointer; color: rgba(184,150,95,0.65);
    display: flex; align-items: center; justify-content: center; }
  #reset-btn:hover { color: rgba(184,150,95,1); }
  #reset-btn:disabled { opacity: 0.35; cursor: default; }

  /* Zona intermedia entre el layout apilado (≤767px) y el desktop donde el
     panel de 50% ya tiene espacio sobrado (~900px+): a 768px (p. ej. iPad
     en vertical) el panel de chat mide 384px, y el padding lateral de
     56px pensado para desktop ancho dejaba tan poco espacio al input que
     el placeholder se cortaba a mitad de palabra ("Platícame, que para
     eso has venid[o]"). Mismo layout de dos columnas (no aplica el
     criterio UX-D2, que solo exige 50% "en desktop"), solo menos padding
     lateral en el input. */
  @media (min-width: 768px) and (max-width: 900px) {
    #input-row { padding-left: 28px; padding-right: 28px; }
  }

  @media (max-width: 767px) {
    #root { flex-direction: column; }
    #image-panel { width: 100%; height: 38vh; min-height: 260px; }
    #image-panel img { object-position: center 18%; }
    #smoke-edge { top: 0; right: 0; left: 0; bottom: 0; width: auto; height: 45%; margin-top: auto;
      background: linear-gradient(180deg, rgba(11,10,16,0) 0%, rgba(11,10,16,0.55) 55%, rgba(11,10,16,0.92) 100%); }
    #chat-panel { width: 100%; height: auto; flex: 1; min-height: 0; }
    #messages { padding: 32px 20px 12px; }
    #input-row { padding: 14px 20px 22px; }
  }

  /* --- Umbral: pantalla previa al chat (privacidad / errores de arranque) --- */
  .threshold-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    overflow-y: auto; background: rgba(8,7,11,0.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 24px; }
  /* En viewports de poca altura (móvil en horizontal, ventana embebida baja)
     el contenido del umbral (consentimiento / error de arranque) puede
     medir más que la ventana. Sin esto, `align-items: center` recorta lo
     que no cabe por ambos extremos y, al ser `position: fixed`, no hay
     scroll del documento que lo compense — el botón de aceptar (bloqueo
     obligatorio antes de poder chatear, ver `_exigir_consentimiento` en
     http_api.py) puede quedar fuera de pantalla sin forma de alcanzarlo. */
  .threshold-overlay > * { margin-block: auto; }
  .threshold-overlay[hidden] { display: none; }
  .threshold-box { max-width: 560px; width: 100%; padding: 44px 40px; border: 1px solid rgba(184,150,95,0.28);
    background: rgba(13,11,17,0.7); }
  .threshold-box h1 { font-family: 'Crimson Pro', serif; font-weight: 500; font-style: italic; font-size: 24px;
    color: #e8dcc8; margin: 0 0 20px; }
  .threshold-box p { font-family: 'Crimson Pro', serif; font-weight: 300; font-size: 14.5px; line-height: 1.7;
    color: #d4d4d8; margin: 0 0 16px; }
  .threshold-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .threshold-btn { font-family: 'Crimson Pro', serif; font-weight: 500; font-size: 14px; letter-spacing: 0.02em;
    color: #0b0a10; background: rgba(184,150,95,0.85); border: none; padding: 13px 28px; cursor: pointer; }
  .threshold-btn:hover { background: rgba(184,150,95,1); }
  .threshold-btn:disabled { opacity: 0.5; cursor: default; }
  .threshold-error { font-family: 'Crimson Pro', serif; font-size: 13px; color: #c98a7a; margin: -8px 0 20px; }
  .threshold-error[hidden] { display: none; }

  /* --- Diseño literal entregado para la caja "Antes de cruzar el umbral" --- */
  #consent-overlay .container {
    max-width: 560px;
    padding: 60px 40px;
    text-align: center;
    border: 2px solid #8b7355;
    background: rgba(20, 20, 20, 0.8);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(139, 115, 85, 0.2);
    font-family: 'Georgia', serif;
    color: #e8e8e8;
  }
  #consent-overlay .title {
    font-size: 32px;
    font-weight: normal;
    font-style: italic;
    margin-bottom: 40px;
    letter-spacing: 1px;
    color: #d4af8a;
  }
  #consent-overlay .divider {
    width: 60px;
    height: 1px;
    background: #8b7355;
    margin: 0 auto 30px;
  }
  #consent-overlay .content {
    margin-bottom: 40px;
    line-height: 1.8;
    font-size: 15px;
  }
  #consent-overlay .legend {
    color: #d4af8a;
    font-style: italic;
    margin-bottom: 20px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.6s ease;
  }
  #consent-overlay .legend.visible {
    opacity: 1;
    max-height: 100px;
  }
  #consent-overlay .sensitive-info {
    font-size: 13px;
    color: #a8a8a8;
    margin-top: 20px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.6s ease;
  }
  #consent-overlay .sensitive-info.visible {
    opacity: 1;
    max-height: 200px;
  }
  #consent-overlay .btn-accept {
    padding: 12px 40px;
    background: #8b7355;
    color: #1a1a1a;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #consent-overlay .btn-accept:hover {
    background: #a89968;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(139, 115, 85, 0.4);
  }
  #consent-overlay .btn-accept:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  #chat-input:disabled, #send-btn:disabled { opacity: 0.35; cursor: default; }

  #waiting-indicator { width: 6px; height: 6px; border-radius: 50%; background: rgba(184,150,95,0.75);
    margin-right: 2px; flex-shrink: 0; animation: waitingPulse 1.1s ease-in-out infinite; }
  #waiting-indicator[hidden] { display: none; }
  @keyframes waitingPulse { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 0.9; transform: scale(1.15); } }

  .inline-error { font-family: 'Crimson Pro', serif; font-size: 12.5px; color: #c98a7a; padding: 0 56px 8px; position: relative; z-index: 1; }
  .inline-error[hidden] { display: none; }
  @media (max-width: 767px) { .inline-error { padding: 0 20px 8px; } }

  /* Foco visible (WCAG 2.4.7). #chat-input pone outline:none para quitar
     el foco por defecto del navegador (que no encaja con el resto del
     sistema visual); sin esta regla no queda NINGÚN indicador de foco en
     todo el archivo, ni en el input ni en los botones — un usuario de
     teclado no puede saber dónde está parado. */
  #send-btn:focus-visible,
  #stop-btn:focus-visible,
  #reset-btn:focus-visible,
  .threshold-btn:focus-visible,
  .btn-accept:focus-visible {
    outline: 2px solid rgba(184,150,95,0.9);
    outline-offset: 2px;
  }
  /* #chat-input tiene su propio indicador (glow bajo el texto, no un
     rectángulo): a diferencia de los botones, el input queda enfocado la
     mayor parte del uso normal (autofoco al arrancar, tras cada
     respuesta, tras reiniciar — ver bootstrap()/enviarMensaje()), así que
     el contorno genérico de formulario estaba visible casi todo el
     tiempo y rompía la estética sin bordes del resto de la interfaz.
     Sigue siendo un indicador de foco real (WCAG 2.4.7), solo en el
     mismo lenguaje visual (dorado, resplandor) que ya usa el resto. */
  #chat-input:focus-visible {
    outline: none;
    box-shadow: 0 2px 0 rgba(184,150,95,0.9), 0 2px 12px 0 rgba(184,150,95,0.35);
  }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>

</head>
<body>

<div id="root">

  <div id="image-panel">
    <img src="/assets/deidad.jpg" alt="Santa Muerte">
    <div id="image-overlay"></div>
    <div id="smoke-edge"></div>
    <div class="fog" id="fog-1" style="top:12%; left:8%; width:220px; height:220px; animation:fogDriftA 11s ease-in-out infinite;"></div>
    <div class="fog" id="fog-2" style="bottom:15%; left:4%; width:260px; height:260px; animation:fogDriftB 9.5s ease-in-out infinite;"></div>
    <div class="fog" id="fog-3" style="top:40%; right:10%; width:200px; height:200px; animation:fogDriftC 10.5s ease-in-out infinite;"></div>
  </div>

  <div id="chat-panel">
    <div class="fog" id="fog-4" style="bottom:10%; left:6%; width:180px; height:180px; animation:fogDriftB 10s ease-in-out infinite;"></div>
    <div class="fog" id="fog-5" style="top:6%; right:8%; width:200px; height:200px; animation:fogDriftA 12s ease-in-out infinite;"></div>

    <button id="reset-btn" aria-label="Reiniciar conversación" title="Reiniciar conversación" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M3 12a9 9 0 1 1 3 6.7" stroke-linecap="round"></path>
        <path d="M3 16v-4h4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    <!-- Región separada, invisible, para lector de pantalla. #messages
         crece carácter a carácter mientras llega el streaming (ver
         streamRespuesta): anunciar cada mutación ahí sería ruido
         fragmentado, no lectura. Este nodo solo se actualiza una vez por
         bloque ya cerrado (mismo corte que ve un usuario vidente en
         formatearBloqueHTML), así que el lector de pantalla recibe una
         unidad legible por anuncio, igual que la interfaz visual. -->
    <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <div id="boot-error-banner" class="inline-error" role="status" aria-live="assertive" hidden></div>

    <div id="input-row">
      <span id="waiting-indicator" hidden aria-hidden="true"></span>
      <input type="text" id="chat-input" placeholder="Estoy aquí para ti." disabled>
      <button id="stop-btn" aria-label="Detener" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1">
          <rect x="5" y="5" width="14" height="14"></rect>
        </svg>
      </button>
      <button id="send-btn" aria-label="Enviar" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1">
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="6" y1="6" x2="4" y2="13" stroke-linecap="round"></line>
          <line x1="18" y1="6" x2="20" y2="13" stroke-linecap="round"></line>
          <path d="M2 13 a4 4 0 0 0 8 0 z"></path>
          <path d="M14 13 a4 4 0 0 0 8 0 z"></path>
          <line x1="12" y1="6" x2="12" y2="20"></line>
          <line x1="8" y1="21" x2="16" y2="21"></line>
        </svg>
      </button>
    </div>
  </div>

</div>

<div id="consent-overlay" class="threshold-overlay" hidden>
  <div class="container">
    <div class="title">Antes de cruzar el umbral<br><small style="font-size: 18px; font-weight: normal;">Acepta la bienvenida</small></div>

    <div class="divider"></div>

    <div class="content">
      <div class="legend visible">
        Bajo la guadaña, altar de encuentro entre devotos.
      </div>

      <div class="sensitive-info visible">
        <strong>Tu información es privada.</strong> El modelo responde ajustándose a ti. Siéntete seguro.
      </div>
    </div>

    <p class="threshold-error" id="consent-error" role="status" aria-live="assertive" hidden></p>

    <div style="margin-top: 20px;">
      <button type="button" class="btn-accept" id="consent-accept-btn">
        Acepto la bienvenida
      </button>

</div>

<div id="boot-error-overlay" class="threshold-overlay" hidden>
  <div class="threshold-box">
    <h1>Algo interrumpió el paso</h1>
    <p id="boot-error-message" role="alert" aria-live="assertive"></p>
    <div class="threshold-actions">
      <button class="threshold-btn" id="boot-error-retry-btn">Reintentar</button>
    </div>
  </div>
</div>

<!--
  Botón de prueba oculto para disparar la intensificación de niebla manualmente
  (sin necesidad de una respuesta real del backend). Descomentar para probar:

  <button id="test-fog-btn" style="position:fixed; bottom:8px; left:8px; z-index:999; opacity:0.15;">test fog</button>
  <script>
    document.getElementById('test-fog-btn').addEventListener('click', triggerIntensify);
  </script>
-->

<script>
  // ─────────────────────────────────────────────────────────────────────
  // Configuración
  // ─────────────────────────────────────────────────────────────────────
  // URL base del backend FastAPI.
  //
  // Por defecto, MISMO ORIGEN (''): el backend sirve este HTML en GET /, así
  // que la página y /api/v1/... viven en el mismo host:puerto y el navegador
  // no dispara peticiones cross-origin — CORS deja de aplicar.
  //
  // Antes esto era 'http://127.0.0.1:8000' fijo. Al abrir la app en
  // http://localhost:8000 (o en cualquier otro host/puerto distinto de
  // 127.0.0.1:8000) la petición sí era cross-origin, y como el backend solo
  // tenía SANTISIMA_CORS_ORIGINS=http://localhost:3000, el preflight
  // respondía 400 "Disallowed CORS origin": la primera llamada del arranque
  // (GET /privacidad) fallaba y la UI mostraba "No se pudo cargar el aviso
  // de privacidad. Verifica tu conexión" — cuando en realidad el backend
  // estaba sano.
  //
  // Estrategia: mismo origen siempre que se pueda detectar; si el HTML se
  // abrió por file:// (Origin null, sin backend detrás) se cae al valor de
  // desarrollo.
  var API_BASE = (function () {
    if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
      return window.location.origin;
    }
    return 'http://127.0.0.1:8000';
  })();

  var LS_DEVICE_TOKEN_KEY = 'santisima_device_token';
  var LS_CONSENT_VERSION_KEY = 'santisima_consent_version';
  var LS_ULTIMA_VISITA_KEY = 'santisima_ultima_visita';
  var LS_ULTIMA_FRASE_KEY = 'santisima_ultima_frase_bienvenida';
  // Debe coincidir con el literal emitido en crewai_adapter.py y
  // langchain_adapter.py cuando el streaming se corta a mitad de camino.
  var MARCADOR_INTERRUPCION = '[La conexión se interrumpió. Por favor, intenta de nuevo.]';

  var fogEls = document.querySelectorAll('.fog');
  var intensifyTimer = null;

  // ─────────────────────────────────────────────────────────────────────
  // Preferencia de movimiento reducido — detectada una vez y actualizada
  // en vivo si el usuario la cambia sin recargar la página.
  // ─────────────────────────────────────────────────────────────────────
  var reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reducedMotion = reducedMotionQuery.matches;
  reducedMotionQuery.addEventListener('change', function (e) {
    reducedMotion = e.matches;
    // Congela cualquier transición en curso, aplica el estado estático de
    // REPOSO sin animarlo (fuerza reflow entre quitar valores y restablecer
    // la transición) y vuelve al estado nombrado 'reposo'.
    fogEls.forEach(function (el) {
      el.style.transition = 'none';
      el.classList.remove('intense');
      el.style.opacity = '';
      el.style.scale = '';
      el.style.animation = '';
    });
    void document.body.offsetHeight;
    fogEls.forEach(function (el) { el.style.transition = ''; });
    clearTimeout(intensifyTimer);
    estadoNiebla = 'reposo';
  });

  // ─────────────────────────────────────────────────────────────────────
  // Máquina de estados de la niebla reactiva.
  //
  // Estados (cada uno atado a un evento real ya existente en el flujo de
  // envío/streaming, no a un efecto nuevo):
  //   - reposo:       baseline. Ciclo lento de fogDriftA/B/C sin intervenir.
  //   - esperando:    desde que se envía el mensaje hasta el primer chunk.
  //                   Acelera el ritmo del drift (no la intensidad).
  //   - respondiendo: desde el primer chunk hasta 'done' (triggerIntensify).
  //   - resuelto:     al recibir 'done' con emoción (triggerIntensifyWithEmocion).
  //   - crisis:       subcaso de 'resuelto' cuando emocion === 'desesperacion'.
  //
  // transicionarEstadoNiebla() es el único punto de entrada/salida: revierte
  // lo que el estado anterior dejó activo (p. ej. el drift acelerado de
  // 'esperando') antes de aplicar el nuevo estado.
  // ─────────────────────────────────────────────────────────────────────
  var estadoNiebla = 'reposo';
  var fogAnimacionesOriginales = [];
  fogEls.forEach(function (el) { fogAnimacionesOriginales.push(el.style.animation); });

  var FOG_ESPERANDO_FACTOR = 0.65; // ligero aumento de velocidad del drift, no de intensidad
  // Silencio prolongado en 'reposo' (sin mensaje nuevo) → el drift ambiental
  // se ralentiza levemente, como si la niebla siguiera respirando en vez de
  // congelarse. Reutiliza el mismo mecanismo que FOG_ESPERANDO_FACTOR (solo
  // reescribe la duración del `animation` ya declarado), así que no agrega
  // ninguna capa visual nueva — solo re-parametriza el drift existente.
  var FOG_IDLE_FACTOR = 1.4;
  var IDLE_RESPIRACION_MS = 45000;
  var idleTimer = null;

  function acelerarFogEspera() {
    if (reducedMotion) return;
    fogEls.forEach(function (el, i) {
      var original = fogAnimacionesOriginales[i];
      el.style.animation = original.replace(/(\d+(?:\.\d+)?)s/, function (m, num) {
        return (parseFloat(num) * FOG_ESPERANDO_FACTOR) + 's';
      });
    });
  }

  function ralentizarFogIdle() {
    if (reducedMotion) return;
    fogEls.forEach(function (el, i) {
      var original = fogAnimacionesOriginales[i];
      el.style.animation = original.replace(/(\d+(?:\.\d+)?)s/, function (m, num) {
        return (parseFloat(num) * FOG_IDLE_FACTOR) + 's';
      });
    });
  }

  function restaurarFogNormal() {
    if (reducedMotion) return;
    fogEls.forEach(function (el, i) { el.style.animation = fogAnimacionesOriginales[i]; });
  }

  // Programa la respiración de inactividad; solo se aplica si el estado
  // sigue siendo 'reposo' cuando el timer dispara (si hubo un mensaje
  // nuevo en el ínterin, el estado ya cambió y este chequeo lo descarta).
  function programarRespiracionIdle() {
    clearTimeout(idleTimer);
    if (reducedMotion) return;
    idleTimer = setTimeout(function () {
      if (estadoNiebla === 'reposo') ralentizarFogIdle();
    }, IDLE_RESPIRACION_MS);
  }

  function transicionarEstadoNiebla(nuevoEstado, emocion) {
    if (estadoNiebla === 'esperando' && nuevoEstado !== 'esperando') {
      restaurarFogNormal();
    }
    if (nuevoEstado === 'resuelto' && emocion === 'desesperacion') {
      nuevoEstado = 'crisis';
    }
    var estadoAnterior = estadoNiebla;
    estadoNiebla = nuevoEstado;
    switch (nuevoEstado) {
      case 'reposo':
        // Si veníamos de 'respondiendo' (stream sin emoción final, o
        // cortado por error), se usa el mismo aterrizaje que 'resuelto'
        // (pico sostenido + fundido) en vez de cortar la intensidad de
        // golpe: toda respuesta merece el mismo cierre visual, tenga o
        // no emoción clasificada. mapeoEmotionIntensidad ya devuelve la
        // misma configuración plana para cualquier valor de `emocion`,
        // incluido `null`.
        if (estadoAnterior === 'respondiendo') triggerIntensifyWithEmocion(null);
        // Reinicia el conteo de silencio cada vez que se entra a 'reposo'
        // (incluido el estado inicial, antes del primer mensaje).
        programarRespiracionIdle();
        break;
      case 'esperando':
        acelerarFogEspera();
        break;
      case 'respondiendo':
        sostenerIntensidad();
        break;
      case 'resuelto':
      case 'crisis':
        triggerIntensifyWithEmocion(emocion);
        break;
    }
  }

  // Arranca el conteo de silencio también antes del primer mensaje: el
  // estado inicial ya es 'reposo' pero nunca pasó por
  // transicionarEstadoNiebla().
  programarRespiracionIdle();

  // Sube la niebla periférica a intensidad y la SOSTIENE ahí — no vuelve
  // sola a reposo. Antes se apagaba con un timeout de 350ms sin importar
  // si el streaming seguía; la lectura completa de la respuesta (el tramo
  // más largo de la interacción) pasaba con la niebla ya en reposo. Ahora
  // se mantiene activa mientras dura 'respondiendo', y quien saca al
  // sistema de ese estado (el 'done' del stream, con o sin emoción, o el
  // manejo de error de streamRespuesta) siempre pasa por
  // triggerIntensifyWithEmocion para el mismo aterrizaje suave.
  // Entrada al estado 'respondiendo' — ver transicionarEstadoNiebla().
  function sostenerIntensidad() {
    if (reducedMotion) return;
    clearTimeout(intensifyTimer);
    fogEls.forEach(function (el) { el.classList.add('intense'); });
  }

  // Pulso breve por cada fragmento de texto que llega mientras se
  // streamea la respuesta — encima de la intensidad ya sostenida por
  // sostenerIntensidad(). Sin esto, 'respondiendo' es un estado plano
  // (sube una vez y se queda quieto); con esto, la niebla respira al
  // ritmo real de la generación, no solo al principio y al final.
  // Usa Web Animations API en vez de la clase .intense: una animación de
  // WAAPI sin fill:forwards se anima sobre el valor base (aquí, el
  // scale:1.35 de .intense) y vuelve sola a él al terminar, sin pelear
  // con la transición CSS de la clase ni con el drift ambiental (que ya
  // no toca `scale`, solo `translate` — ver @keyframes fogDriftA/B/C).
  var ultimoPulso = 0;
  var PULSO_INTERVALO_MIN_MS = 220; // evita que chunks muy seguidos generen parpadeo
  function pulsoFog() {
    if (reducedMotion) return;
    var ahora = Date.now();
    if (ahora - ultimoPulso < PULSO_INTERVALO_MIN_MS) return;
    ultimoPulso = ahora;
    fogEls.forEach(function (el) {
      el.animate(
        [{ scale: 1.35 }, { scale: 1.46 }, { scale: 1.35 }],
        { duration: 260, easing: 'ease-out' }
      );
    });
  }

  var input = document.getElementById('chat-input');
  var sendBtn = document.getElementById('send-btn');
  var stopBtn = document.getElementById('stop-btn');
  var resetBtn = document.getElementById('reset-btn');
  var messagesEl = document.getElementById('messages');
  var bootErrorBanner = document.getElementById('boot-error-banner');
  var waitingIndicator = document.getElementById('waiting-indicator');
  var srAnnouncer = document.getElementById('sr-announcer');

  // Anuncia UNA unidad legible por lector de pantalla (ver comentario junto
  // a #sr-announcer). aria-atomic hace que cada asignación se lea entera,
  // así que basta con reasignar textContent con el bloque recién cerrado.
  function anunciarBloque(textoPlano) {
    if (!textoPlano) return;
    srAnnouncer.textContent = textoPlano;
  }

  var consentOverlay = document.getElementById('consent-overlay');
  var consentAcceptBtn = document.getElementById('consent-accept-btn');
  var consentErrorEl = document.getElementById('consent-error');

  var bootErrorOverlay = document.getElementById('boot-error-overlay');
  var bootErrorMessage = document.getElementById('boot-error-message');
  var bootErrorRetryBtn = document.getElementById('boot-error-retry-btn');

  var deviceToken = null;
  var sessionId = null;

  // ─────────────────────────────────────────────────────────────────────
  // Cliente HTTP mínimo
  // ─────────────────────────────────────────────────────────────────────
  function apiRequest(method, path, body, auth) {
    var headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (auth) headers['Authorization'] = 'Bearer ' + deviceToken;
    return fetch(API_BASE + path, {
      method: method,
      headers: headers,
      body: body !== undefined ? JSON.stringify(body) : undefined
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.json().catch(function () { return {}; }).then(function (j) {
          var err = new Error((j && j.detail) || ('HTTP ' + resp.status));
          err.status = resp.status;
          throw err;
        });
      }
      if (resp.status === 204) return null;
      return resp.json();
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // Identidad de dispositivo
  // ─────────────────────────────────────────────────────────────────────
  // Nota de plataforma: localStorage es el almacenamiento más cercano a un
  // "almacén seguro" disponible en un navegador web sin infraestructura
  // adicional. En una app nativa real (iOS/Android) el device_token debe
  // vivir en Keychain/Keystore del sistema operativo, no en almacenamiento
  // de dominio accesible por JS — aquí es una limitación aceptada del
  // entorno web, no la recomendación general.
  function ensureDevice() {
    var stored = null;
    try { stored = localStorage.getItem(LS_DEVICE_TOKEN_KEY); } catch (e) { /* almacenamiento no disponible */ }
    if (stored) {
      deviceToken = stored;
      return Promise.resolve();
    }
    return apiRequest('POST', '/api/v1/dispositivos').then(function (data) {
      deviceToken = data.device_token;
      try { localStorage.setItem(LS_DEVICE_TOKEN_KEY, deviceToken); } catch (e) { /* almacenamiento no disponible */ }
    });
  }

  // Fuerza un registro de dispositivo nuevo ignorando el token guardado.
  // Necesario cuando el backend rechaza el token con 401: la firma ya no
  // valida (p. ej. el servidor rotó SANTISIMA_SESSION_SECRET desde que se
  // emitió), así que reintentar con el mismo token guardado repetiría el
  // mismo 401 indefinidamente.
  function registrarDispositivoNuevo() {
    try { localStorage.removeItem(LS_DEVICE_TOKEN_KEY); } catch (e) { /* almacenamiento no disponible */ }
    deviceToken = null;
    return apiRequest('POST', '/api/v1/dispositivos').then(function (data) {
      deviceToken = data.device_token;
      try { localStorage.setItem(LS_DEVICE_TOKEN_KEY, deviceToken); } catch (e) { /* almacenamiento no disponible */ }
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // Aviso de privacidad y consentimiento explícito
  // ─────────────────────────────────────────────────────────────────────
  function mostrarPantallaConsentimiento(privacidad) {
    return new Promise(function (resolve) {
      // El overlay traía un texto atmosférico fijo en el HTML que nunca se
      // sustituía: el usuario aceptaba una "versión" del aviso sin ver el
      // aviso real que el backend genera (cifrado sí/no, DeepInfra,
      // retención) — ver GET /privacidad en http_api.py. Se pinta aquí.
      var infoEl = consentOverlay.querySelector('.sensitive-info');
      if (infoEl && privacidad && privacidad.resumen) {
        infoEl.innerHTML = '<strong>Tu información es privada.</strong> ' + escaparHtml(privacidad.resumen);
      }
      consentOverlay.hidden = false;

      function enviarConsentimiento(reintentoPorTokenInvalido) {
        return apiRequest(
          'POST', '/api/v1/dispositivos/consentimiento', { version: privacidad.version }, true
        ).then(function () {
          try { localStorage.setItem(LS_CONSENT_VERSION_KEY, privacidad.version); } catch (e) { }
          consentOverlay.hidden = true;
          resolve();
        }).catch(function (err) {
          // 401: el device_token guardado ya no es válido (p. ej. el
          // servidor rotó el secreto de sesión desde que se emitió) — no es
          // un problema de red. Nos recuperamos solos registrando un
          // dispositivo nuevo y reintentando, una sola vez, sin mostrarle
          // al usuario un error que no puede resolver por su cuenta.
          if (err.status === 401 && !reintentoPorTokenInvalido) {
            return registrarDispositivoNuevo().then(function () {
              return enviarConsentimiento(true);
            });
          }
          throw err;
        });
      }

      consentAcceptBtn.onclick = function () {
        consentAcceptBtn.disabled = true;
        consentErrorEl.hidden = true;
        var textoOriginal = consentAcceptBtn.textContent;
        consentAcceptBtn.textContent = 'Registrando…';
        enviarConsentimiento(false)
          .catch(function (err) {
            console.error('No se pudo registrar el consentimiento:', err);
            consentAcceptBtn.textContent = textoOriginal;
            consentAcceptBtn.disabled = false;
            consentErrorEl.textContent = err.status
              ? 'No se pudo registrar tu consentimiento (' + err.status + '). Intenta de nuevo.'
              : 'No se pudo registrar tu consentimiento. Verifica tu conexión e inténtalo de nuevo.';
            consentErrorEl.hidden = false;
          });
      };
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // Sesión
  // ─────────────────────────────────────────────────────────────────────
  function ensureSession() {
    return apiRequest('POST', '/api/v1/sesiones', undefined, true).then(function (data) {
      sessionId = data.session_id;
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // Arranque: registro de dispositivo → privacidad/consentimiento → sesión
  // ─────────────────────────────────────────────────────────────────────
  function mostrarErrorArranque(mensaje, reintentar) {
    bootErrorMessage.textContent = mensaje;
    bootErrorOverlay.hidden = false;
    bootErrorRetryBtn.onclick = function () {
      bootErrorOverlay.hidden = true;
      reintentar();
    };
  }

  // Un fallo de red (backend caído) y un fallo de CORS llegan aquí igual:
  // fetch rechaza con TypeError y sin status. Distinguirlos importa porque
  // "Verifica tu conexión" manda a revisar la red cuando el problema real
  // suele ser que el backend no autoriza el origen de esta página. Para
  // separarlos se comprueba si el backend responde en /health con modo
  // no-cors: si /health contesta, la red está bien y lo que falta es CORS.
  function describirFalloArranque(paso, detalle) {
    return fetch(API_BASE + '/health', { mode: 'no-cors', cache: 'no-store' })
      .then(function () {
        return paso + ' El backend responde, pero rechazó esta página ' +
          '(CORS): agrega el origen ' + window.location.origin +
          ' a SANTISIMA_CORS_ORIGINS del backend y reinícialo.';
      })
      .catch(function () {
        return paso + ' No hay respuesta del backend en ' + API_BASE +
          '. Verifica que esté corriendo' + (detalle ? ' (' + detalle + ')' : '') + '.';
      });
  }

  function mostrarErrorArranqueConDiagnostico(paso, detalle) {
    describirFalloArranque(paso, detalle).then(function (mensaje) {
      mostrarErrorArranque(mensaje, bootstrap);
    });
  }

  function bootstrap(reintentoDispositivo) {
    ensureDevice()
      .catch(function () {
        mostrarErrorArranqueConDiagnostico('No se pudo establecer tu identidad de dispositivo.');
        return Promise.reject('boot_detenido');
      })
      .then(function () {
        return apiRequest('GET', '/privacidad').catch(function () {
          mostrarErrorArranqueConDiagnostico('No se pudo cargar el aviso de privacidad.');
          return Promise.reject('boot_detenido');
        });
      })
      .then(function (privacidad) {
        var versionCacheada = null;
        try { versionCacheada = localStorage.getItem(LS_CONSENT_VERSION_KEY); } catch (e) { }
        if (versionCacheada === privacidad.version) {
          return Promise.resolve();
        }
        return mostrarPantallaConsentimiento(privacidad);
      })
      .then(function () {
        return ensureSession().catch(function (err) {
          // ensureDevice() nunca valida contra el backend un device_token ya
          // cacheado en localStorage — lo da por bueno hasta que falla aquí.
          // Si el backend ya no lo reconoce (401: p. ej. quedó de una base
          // de datos o instalación distinta), no basta con pedir uno nuevo:
          // el consentimiento cacheado en localStorage quedó registrado para
          // el dispositivo VIEJO, no para el que se va a crear — si no se
          // olvida también, el siguiente mensaje fallaría con 403 en bucle.
          // `reintentoDispositivo` evita reintentar para siempre si el
          // backend está genuinamente caído (un fallo que no sea 401, o que
          // persista tras el primer intento, sí debe mostrarse al usuario).
          if (err.status === 401 && !reintentoDispositivo) {
            try {
              localStorage.removeItem(LS_DEVICE_TOKEN_KEY);
              localStorage.removeItem(LS_CONSENT_VERSION_KEY);
            } catch (e) { }
            bootstrap(true);
            // El reintento ya maneja su propio arranque completo (incluido
            // crearMensajeWelcome() si tiene éxito); esta cadena no debe
            // continuar ni mostrar un error encima del reintento.
            return Promise.reject('boot_detenido');
          }
          mostrarErrorArranqueConDiagnostico('No se pudo iniciar tu sesión.');
          return Promise.reject('boot_detenido');
        });
      })
      .then(function () {
        crearMensajeWelcome();
        input.disabled = false;
        sendBtn.disabled = false;
        resetBtn.disabled = false;
        input.focus();
      })
      .catch(function (err) {
        if (err !== 'boot_detenido') {
          mostrarErrorArranqueConDiagnostico('Ocurrió un error inesperado al iniciar.');
        }
      });
  }

  // ─────────────────────────────────────────────────────────────────────
  // Mensajería (misma estructura DOM que usaban los mensajes de ejemplo)
  // ─────────────────────────────────────────────────────────────────────
  function horaActual() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function scrollAlFinal() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function agregarMensajeUsuario(texto) {
    var row = document.createElement('div');
    row.className = 'msg-user-row';
    row.innerHTML =
      '<div class="msg-user-inner">' +
        '<div class="msg-user-line"></div>' +
        '<div class="msg-user-col">' +
          '<div class="text"></div>' +
          '<div class="msg-time user"></div>' +
        '</div>' +
      '</div>';
    row.querySelector('.text').textContent = texto;
    row.querySelector('.msg-time').textContent = horaActual();
    messagesEl.appendChild(row);
    scrollAlFinal();
  }

  function crearMensajeDeidadVacio() {
    var el = document.createElement('div');
    el.className = 'msg-deity';
    el.innerHTML = '<div class="text"></div><div class="msg-time deity"></div>';
    messagesEl.appendChild(el);
    scrollAlFinal();
    return el;
  }

  // Frases agrupadas por franja horaria — todas en la misma voz en primera
  // persona que ya usa el resto del flujo (ADR-0005), sin variedad "de
  // IA conversacional": son variaciones del mismo gesto ("te esperaba"),
  // no contenido nuevo.
  var FRASES_BIENVENIDA = {
    madrugada: ['Ni la hora te aleja de este lugar.', 'Has llegado al lugar indicado, aún en la madrugada.'],
    manana: ['Has llegado al lugar indicado.', 'Aquí, desde temprano, es tu lugar.'],
    tarde: ['Has llegado al lugar indicado.', 'Aquí sigue tu lugar, contigo.'],
    noche: ['La noche te trae de vuelta a este lugar.', 'Has llegado al lugar indicado, ahora que cae la noche.']
  };
  var FRASE_REGRESO_LARGO = 'Ha pasado tiempo. Has llegado al lugar indicado.';
  var FRASE_REINICIO = 'Empecemos de nuevo. Aquí sigo.';
  var REGRESO_LARGO_MS = 12 * 60 * 60 * 1000; // 12h sin visitar

  function franjaHoraria() {
    var h = new Date().getHours();
    if (h < 6) return 'madrugada';
    if (h < 12) return 'manana';
    if (h < 19) return 'tarde';
    return 'noche';
  }

  // Señales conductuales disponibles sin backend ni clasificación de texto:
  // tiempo desde la última visita (localStorage) y si este mensaje viene de
  // un reinicio explícito del usuario (ver resetBtn) o de un arranque
  // normal. Evita repetir la misma frase dos veces seguidas dentro de la
  // misma franja/contexto guardando el último índice usado.
  function elegirFraseBienvenida(contexto) {
    var ahora = Date.now();
    var ultimaVisita = null;
    try { ultimaVisita = parseInt(localStorage.getItem(LS_ULTIMA_VISITA_KEY), 10); } catch (e) { }

    if (contexto === 'reinicio') {
      try { localStorage.setItem(LS_ULTIMA_VISITA_KEY, String(ahora)); } catch (e) { }
      return FRASE_REINICIO;
    }

    var frase;
    if (ultimaVisita && (ahora - ultimaVisita) >= REGRESO_LARGO_MS) {
      frase = FRASE_REGRESO_LARGO;
    } else {
      var candidatas = FRASES_BIENVENIDA[franjaHoraria()];
      var ultimaFrase = null;
      try { ultimaFrase = localStorage.getItem(LS_ULTIMA_FRASE_KEY); } catch (e) { }
      var disponibles = candidatas.filter(function (f) { return f !== ultimaFrase; });
      frase = (disponibles.length ? disponibles : candidatas)[0];
    }

    try {
      localStorage.setItem(LS_ULTIMA_VISITA_KEY, String(ahora));
      localStorage.setItem(LS_ULTIMA_FRASE_KEY, frase);
    } catch (e) { }
    return frase;
  }

  // La frase de bienvenida rota sola mientras siga siendo lo único en
  // pantalla (nadie escribió todavía): sin esto, quedaba fija el tiempo
  // que el usuario tardara en decidirse a escribir, lo que en una espera
  // larga se lee como que la interfaz se congeló en esa frase. Se detiene
  // en cuanto hay un primer mensaje real (detenerRotacionBienvenida() en
  // enviarMensaje) — después de eso la burbuja es historial de la
  // conversación, no bienvenida activa, y no debe seguir cambiando sola.
  var FRASE_ROTACION_MS = 45000;
  var fraseRotacionTimer = null;
  var elementoBienvenidaActivo = null;

  function detenerRotacionBienvenida() {
    clearTimeout(fraseRotacionTimer);
    elementoBienvenidaActivo = null;
  }

  // Disolución tipo ceniza en vez de un fundido de opacidad plano: la
  // frase pierde nitidez y se asienta levemente hacia abajo al irse
  // (blur + translateY, no solo opacity), y la que la reemplaza entra
  // desde el mismo estado disuelto hacia nitidez total — coherente con la
  // imaginería ya establecida (niebla, cirios) en vez de un efecto de UI
  // genérico.
  function rotarFraseBienvenida() {
    var el = elementoBienvenidaActivo;
    if (!el) return;
    var nuevaFrase = elegirFraseBienvenida();
    if (reducedMotion) {
      el.textContent = nuevaFrase;
    } else {
      el.style.transition = 'opacity 0.6s ease-in, filter 0.6s ease-in, transform 0.6s ease-in';
      el.style.opacity = '0';
      el.style.filter = 'blur(3px)';
      el.style.transform = 'translateY(5px)';
      setTimeout(function () {
        if (elementoBienvenidaActivo !== el) return; // ya se envió un mensaje o hubo otro reinicio
        el.textContent = nuevaFrase;
        el.style.transition = 'none';
        el.style.filter = 'blur(2px)';
        el.style.transform = 'translateY(-3px)';
        void el.offsetHeight; // fuerza reflow: sin esto el navegador fusiona este estado con el siguiente y nunca se ve la entrada
        el.style.transition = 'opacity 0.5s ease-out, filter 0.5s ease-out, transform 0.5s ease-out';
        el.style.opacity = '1';
        el.style.filter = 'blur(0)';
        el.style.transform = 'translateY(0)';
      }, 600);
    }
    fraseRotacionTimer = setTimeout(rotarFraseBienvenida, FRASE_ROTACION_MS);
  }

  function iniciarRotacionBienvenida(el) {
    detenerRotacionBienvenida();
    elementoBienvenidaActivo = el;
    fraseRotacionTimer = setTimeout(rotarFraseBienvenida, FRASE_ROTACION_MS);
  }

  function crearMensajeWelcome(contexto) {
    var el = crearMensajeDeidadVacio();
    var textoEl = el.querySelector('.text');
    textoEl.textContent = elegirFraseBienvenida(contexto);
    el.querySelector('.msg-time').style.display = 'none';
    iniciarRotacionBienvenida(textoEl);
  }

  function mostrarErrorInline(mensaje) {
    bootErrorBanner.textContent = mensaje;
    bootErrorBanner.hidden = false;
    setTimeout(function () { bootErrorBanner.hidden = true; }, 6000);
  }

  // ─────────────────────────────────────────────────────────────────────
  // Envío + streaming SSE
  // ─────────────────────────────────────────────────────────────────────
  // Tratamiento PLANO, deliberadamente idéntico para toda emoción —
  // incluida 'desesperacion'. Antes este mapeo daba a 'desesperacion' el
  // tramo más intenso y más largo de los cuatro (alfa 0.85, scale 1.35,
  // 2200ms de sostenimiento) mientras 'esperanza'/'alegria' apenas
  // pulsaban 350ms: una crisis emocional grave recibía la reacción visual
  // más dramática del sistema. Eso es exactamente el "tratamiento visual
  // diferenciado por emoción" que docs/ux-criterios-evaluacion.md §1 y el
  // hallazgo #10 (ADR-0005) prohíben mientras no exista un protocolo de
  // crisis revisado: "todas las emociones se ven igual hasta que ese
  // protocolo exista". `emocion` se recibe y se ignora a propósito — el
  // día que el protocolo exista, la diferenciación se reintroduce aquí,
  // con ese protocolo como base, no antes.
  function mapeoEmotionIntensidad(emocion) {
    return { alfa: 0.72, scale: 1.15, duracion: 600, transicion: 500 };
  }

  // Entrada al estado 'resuelto' (o su subcaso 'crisis' si emocion ===
  // 'desesperacion') — ver transicionarEstadoNiebla().
  function triggerIntensifyWithEmocion(emocion) {
    if (reducedMotion) return;
    var config = mapeoEmotionIntensidad(emocion);
    fogEls.forEach(function (el) {
      el.style.transition = 'none';
      el.style.opacity = '1';
      el.style.scale = String(config.scale);
      el.style.background = 'radial-gradient(circle, rgba(100,90,115,' + config.alfa + ') 0%, rgba(100,90,115,0) 72%)';
    });
    clearTimeout(intensifyTimer);
    intensifyTimer = setTimeout(function () {
      fogEls.forEach(function (el) {
        var s = (config.transicion / 1000) + 's ease-out';
        el.style.transition = 'scale ' + s + ', opacity ' + s + ', background ' + s;
        el.style.opacity = '';
        el.style.scale = '';
        el.style.background = '';
        el.classList.remove('intense');
      });
    }, config.duracion);
  }

  // Cada llamada a enviarMensaje() abre un turno propio. Si el usuario
  // detiene o dispara otro envío, turnoActual avanza y cualquier chunk que
  // llegue tarde de un turno viejo (ya sea por reconexión de sesión o por un
  // stream que sigue vivo tras abortar) se descarta en vez de escribirse en
  // una burbuja que ya no corresponde a la conversación actual.
  var turnoActual = 0;
  var controladorActual = null;
  var mensajeTurnoActual = null;
  var deityElActivo = null;
  var reconciliando = false;

  // ─────────────────────────────────────────────────────────────────────
  // Fragmentación en bloques legibles + formateo visual (solo presentación,
  // el backend sigue devolviendo texto plano sin marcado). Un "bloque" son
  // hasta MAX_ORACIONES_BLOQUE oraciones que terminan en su propia burbuja
  // .msg-deity; el fade-in de cada burbuja ya lo da @keyframes messageIn.
  // ─────────────────────────────────────────────────────────────────────
  var MAX_ORACIONES_BLOQUE = 3;
  var DELAY_BLOQUE_MIN_MS = 400;
  var DELAY_BLOQUE_MAX_MS = 600;
  var PALABRAS_CLAVE = [
    'fe', 'protección', 'protege', 'luz', 'sombra', 'muerte', 'alma', 'camino',
    'silencio', 'paz', 'dolor', 'miedo', 'esperanza', 'amor', 'devoción',
    'fuerza', 'fortaleza', 'destino', 'confía', 'confianza'
  ];
  var EMOJIS_TEMATICOS = ['🔮', '🙏', '⚰️'];
  var ultimaReaccionEmojiTs = 0;
  var mensajesDesdeReaccion = 0;

  function delayBloqueAleatorio() {
    return DELAY_BLOQUE_MIN_MS + Math.random() * (DELAY_BLOQUE_MAX_MS - DELAY_BLOQUE_MIN_MS);
  }

  function dividirEnOraciones(texto) {
    var m = texto.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g);
    return m ? m.map(function (s) { return s.trim(); }).filter(Boolean) : [];
  }

  function escaparHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Reacción discreta: nunca en cada mensaje. Cadencia objetivo 1-2 por
  // cada 3-5 mensajes, espaciadas al menos ~70s (punto medio de 60-90s).
  function elegirEmojiSiCorresponde() {
    var ahora = Date.now();
    mensajesDesdeReaccion++;
    var espaciadoOk = (ahora - ultimaReaccionEmojiTs) >= 70000;
    var frecuenciaOk = mensajesDesdeReaccion >= (3 + Math.floor(Math.random() * 3));
    if (!espaciadoOk || !frecuenciaOk) return '';
    ultimaReaccionEmojiTs = ahora;
    mensajesDesdeReaccion = 0;
    return EMOJIS_TEMATICOS[Math.floor(Math.random() * EMOJIS_TEMATICOS.length)];
  }

  // Arma el HTML de un bloque ya cerrado: negrita en, como mucho, la
  // primera oración con una palabra clave temática; salto de línea cada
  // 2 oraciones; emoji solo si es el último bloque de la respuesta y
  // elegirEmojiSiCorresponde() lo habilita.
  function formatearBloqueHTML(oraciones, esUltimoBloqueDeRespuesta) {
    var yaNegrita = false;
    var marcadas = oraciones.map(function (fraseCruda) {
      var frase = escaparHtml(fraseCruda);
      if (!yaNegrita) {
        var fraseMin = frase.toLowerCase();
        for (var k = 0; k < PALABRAS_CLAVE.length; k++) {
          if (fraseMin.indexOf(PALABRAS_CLAVE[k]) !== -1) {
            yaNegrita = true;
            return '<strong>' + frase + '</strong>';
          }
        }
      }
      return frase;
    });
    var lineas = [];
    for (var i = 0; i < marcadas.length; i += 2) {
      lineas.push(marcadas.slice(i, i + 2).join(' '));
    }
    var html = lineas.join('<br><br>');
    if (esUltimoBloqueDeRespuesta) {
      var emoji = elegirEmojiSiCorresponde();
      if (emoji) html += ' ' + emoji;
    }
    return html;
  }

  // Reproduce una respuesta ya completa (no-streaming) como una secuencia
  // de burbujas, respetando el máximo de oraciones por bloque y el timing
  // entre mensajes. miTurno se revalida en cada paso por si el usuario
  // canceló o mandó otro mensaje mientras se reproducía.
  function reproducirBloques(deityEl, textoCompleto, miTurno, alTerminar) {
    var oraciones = dividirEnOraciones(textoCompleto);
    var bloques = [];
    for (var i = 0; i < oraciones.length; i += MAX_ORACIONES_BLOQUE) {
      bloques.push(oraciones.slice(i, i + MAX_ORACIONES_BLOQUE));
    }
    if (!bloques.length) bloques.push([textoCompleto]);
    var idx = 0;
    var elActual = deityEl;
    function siguiente() {
      if (miTurno !== turnoActual) return;
      var esUltimo = idx === bloques.length - 1;
      elActual.querySelector('.text').innerHTML = formatearBloqueHTML(bloques[idx], esUltimo);
      scrollAlFinal();
      idx++;
      if (idx >= bloques.length) { if (alTerminar) alTerminar(); return; }
      setTimeout(function () {
        if (miTurno !== turnoActual) return;
        elActual = crearMensajeDeidadVacio();
        elActual.querySelector('.msg-time').textContent = horaActual();
        siguiente();
      }, delayBloqueAleatorio());
    }
    siguiente();
  }

  function streamRespuesta(mensaje, miTurno, signal) {
    // Entrada al estado 'esperando' — desde el envío hasta el primer chunk.
    transicionarEstadoNiebla('esperando');
    var waitingTimer = setTimeout(function () { waitingIndicator.hidden = false; }, 3500);
    var primerChunk = true;
    var deityEl = null;
    var textEl = null;
    // Buffer de la oración/es acumuladas en la burbuja abierta actual, y
    // texto que sigue llegando mientras una transición de burbuja está en
    // curso (se vuelca en la nueva burbuja apenas se crea).
    var bloqueBuffer = '';
    var textoEnEspera = '';
    var transicionEnCurso = false;
    var pendingBubbleTimer = null;

    function limpiarEspera() {
      clearTimeout(waitingTimer);
      waitingIndicator.hidden = true;
    }

    return fetch(API_BASE + '/api/v1/mensajes/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + deviceToken },
      body: JSON.stringify({ mensaje: mensaje, session_id: sessionId }),
      signal: signal
    }).then(function (resp) {
      if (!resp.ok) {
        limpiarEspera();
        var err = new Error('stream_failed');
        err.status = resp.status;
        throw err;
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffer = '';

      function leer() {
        if (miTurno !== turnoActual) {
          limpiarEspera();
          return reader.cancel().catch(function () { });
        }
        return reader.read().then(function (res) {
          if (miTurno !== turnoActual) { limpiarEspera(); return; }
          if (res.done) { limpiarEspera(); return; }
          buffer += decoder.decode(res.value, { stream: true });
          var bloques = buffer.split('\n\n');
          buffer = bloques.pop();
          for (var i = 0; i < bloques.length; i++) {
            var bloque = bloques[i];
            if (!bloque.trim()) continue;
            var lineas = bloque.split('\n');
            var eventType = 'message';
            var dataLineas = [];
            for (var j = 0; j < lineas.length; j++) {
              var linea = lineas[j];
              if (linea.indexOf('event:') === 0) eventType = linea.slice(6).trim();
              else if (linea.indexOf('data:') === 0) dataLineas.push(linea.slice(5).replace(/^ /, ''));
            }
            if (eventType === 'done') {
              limpiarEspera();
              clearTimeout(pendingBubbleTimer);
              if (transicionEnCurso && textoEnEspera && textEl) {
                textEl.textContent += textoEnEspera;
                bloqueBuffer += textoEnEspera;
                textoEnEspera = '';
              }
              transicionEnCurso = false;
              var datosFinales = dataLineas.join('\n').trim();
              var emocionFinal = null;
              if (datosFinales) {
                try {
                  var json = JSON.parse(datosFinales);
                  if (json.emocion && json.emocion !== 'ninguna' && json.emocion !== null) {
                    emocionFinal = json.emocion;
                  }
                } catch (e) { }
              }
              // Cierra el último bloque abierto con el mismo formateo
              // (negrita/saltos/emoji) que los bloques intermedios — hasta
              // aquí el texto se mostró plano para no pelear con el streaming
              // caracter a caracter.
              if (textEl && bloqueBuffer) {
                textEl.innerHTML = formatearBloqueHTML(dividirEnOraciones(bloqueBuffer), true);
                anunciarBloque(bloqueBuffer);
              }
              // Siempre hay que sacar a la niebla del estado 'respondiendo'
              // sostenido, haya emoción o no: si no la hay, no queda ningún
              // otro punto del código que la devuelva a reposo.
              transicionarEstadoNiebla(emocionFinal ? 'resuelto' : 'reposo', emocionFinal);
              return;
            }
            var chunk = dataLineas.join('\n');
            if (!chunk) continue;
            // El motor puede cortar la generación e insertar este marcador
            // literal en pleno chunk (crewai_adapter.py / langchain_adapter.py):
            // es un aviso de infraestructura, no algo que "dijo" la deidad, así
            // que se separa del texto visible y se muestra como error de UI.
            var idxMarcador = chunk.indexOf(MARCADOR_INTERRUPCION);
            var textoVisible = idxMarcador === -1 ? chunk : chunk.slice(0, idxMarcador);
            if (textoVisible) {
              if (primerChunk) {
                limpiarEspera();
                transicionarEstadoNiebla('respondiendo');
                deityEl = crearMensajeDeidadVacio();
                textEl = deityEl.querySelector('.text');
                deityEl.querySelector('.msg-time').textContent = horaActual();
                primerChunk = false;
                deityElActivo = deityEl;
              } else {
                // No en el primer chunk: la transición de entrada a
                // 'respondiendo' (0.35s subiendo a scale 1.35) ya está
                // corriendo, y un pulso justo encima se vería como un salto.
                pulsoFog();
              }

              if (transicionEnCurso) {
                // Ya se cerró un bloque y se está esperando el delay antes
                // de abrir la siguiente burbuja: lo que siga llegando se
                // guarda y se vuelca cuando esa burbuja exista.
                textoEnEspera += textoVisible;
              } else {
                textEl.textContent += textoVisible;
                bloqueBuffer += textoVisible;
                scrollAlFinal();
                var oracionesBuffer = dividirEnOraciones(bloqueBuffer);
                var terminaEnLimiteOracion = /[.!?]\s*$/.test(bloqueBuffer);
                if (terminaEnLimiteOracion && oracionesBuffer.length >= MAX_ORACIONES_BLOQUE) {
                  textEl.innerHTML = formatearBloqueHTML(oracionesBuffer, false);
                  anunciarBloque(oracionesBuffer.join(' '));
                  bloqueBuffer = '';
                  transicionEnCurso = true;
                  pendingBubbleTimer = setTimeout(function () {
                    transicionEnCurso = false;
                    if (miTurno !== turnoActual) return;
                    deityEl = crearMensajeDeidadVacio();
                    textEl = deityEl.querySelector('.text');
                    deityEl.querySelector('.msg-time').textContent = horaActual();
                    deityElActivo = deityEl;
                    if (textoEnEspera) {
                      textEl.textContent = textoEnEspera;
                      bloqueBuffer = textoEnEspera;
                      textoEnEspera = '';
                      scrollAlFinal();
                    }
                  }, delayBloqueAleatorio());
                }
              }
            }
            if (idxMarcador !== -1) {
              mostrarErrorInline('La respuesta se interrumpió a mitad de camino. Puedes intentar de nuevo.');
            }
          }
          return leer();
        });
      }
      return leer();
    }).catch(function (err) {
      // reader.read() puede rechazar (conexión cortada a mitad de lectura)
      // sin pasar por ninguno de los limpiarEspera() de arriba: sin esto,
      // waitingTimer sigue vivo y el indicador "escribiendo…" aparece
      // después de que la petición ya murió.
      limpiarEspera();
      // Si el fallo ocurrió en 'esperando' (antes del primer chunk) hay
      // que revertir el drift acelerado; si ocurrió en 'respondiendo'
      // (stream cortado a mitad de camino) hay que apagar la intensidad
      // sostenida — en ambos casos, sin esto la niebla queda pegada en un
      // estado que ya no corresponde a nada.
      if (estadoNiebla === 'esperando' || estadoNiebla === 'respondiendo') {
        transicionarEstadoNiebla('reposo');
      }
      throw err;
    });
  }

  // Compartida entre la reconciliación de segundo plano (CV-I3) y el
  // fallback no-streaming (§1): escribe una respuesta ya completa (no un
  // stream de chunks) en la burbuja del turno, creándola si el streaming
  // nunca llegó a abrirla.
  function escribirRespuestaCompleta(miTurno, respuesta, emocion) {
    if (miTurno !== turnoActual) return;
    var deityEl = deityElActivo;
    if (!deityEl) {
      deityEl = crearMensajeDeidadVacio();
      deityEl.querySelector('.msg-time').textContent = horaActual();
    }
    reproducirBloques(deityEl, respuesta, miTurno, function () {
      transicionarEstadoNiebla(emocion ? 'resuelto' : 'reposo', emocion);
    });
  }

  // §1: "camino de degradación si el stream falla: reintento sin
  // streaming, nunca pantalla en blanco". Solo se usa para fallos
  // genéricos (red, 5xx, CORS) — 403/429 son respuestas semánticas del
  // backend que un reintento sin streaming repetiría igual.
  function degradarSinStreaming(miTurno, texto) {
    return apiRequest('POST', '/api/v1/mensajes', { mensaje: texto, session_id: sessionId }, true)
      .then(function (data) {
        var emocion = data.emocion && data.emocion !== 'ninguna' ? data.emocion : null;
        escribirRespuestaCompleta(miTurno, data.respuesta, emocion);
      })
      .catch(function (err) {
        console.error('Fallback no-streaming también falló:', err);
        if (miTurno === turnoActual && (estadoNiebla === 'esperando' || estadoNiebla === 'respondiendo')) {
          transicionarEstadoNiebla('reposo');
        }
        mostrarErrorInline('No se pudo obtener respuesta. Verifica tu conexión.');
      });
  }

  function enviarMensaje(texto) {
    detenerRotacionBienvenida();
    agregarMensajeUsuario(texto);
    input.disabled = true;
    sendBtn.hidden = true;
    stopBtn.hidden = false;

    turnoActual += 1;
    var miTurno = turnoActual;
    mensajeTurnoActual = texto;
    deityElActivo = null;

    function intentar(reintentoSesion) {
      controladorActual = new AbortController();
      return streamRespuesta(texto, miTurno, controladorActual.signal).catch(function (err) {
        if (err && err.name === 'AbortError') {
          // Detenido por el usuario: el texto ya recibido se conserva tal
          // cual quedó en el DOM, sin banner de error ni reintento.
          return;
        }
        if (err.status === 404 && !reintentoSesion) {
          // Sesión inválida: regenerar y reintentar una sola vez. Si la
          // regeneración falla, el rechazo no debe quedar sin manejar (eso
          // dejaría el input bloqueado en "enviando" para siempre) — se cae
          // al mismo camino degradado que cualquier otro error de stream.
          return ensureSession().then(
            function () { return intentar(true); },
            function () { return degradarSinStreaming(miTurno, texto); }
          );
        }
        if (err.status === 403) {
          mostrarErrorInline('Tu consentimiento venció. Recarga la página para continuar.');
          return;
        }
        if (err.status === 429) {
          mostrarErrorInline('Demasiados mensajes. Espera un momento antes de volver a intentar.');
          return;
        }
        return degradarSinStreaming(miTurno, texto);
      });
    }

    intentar(false).then(function () {
      controladorActual = null;
      // Si turnoActual ya avanzó (otro mensaje se envió mientras este
      // seguía resolviendo), ese turno nuevo es quien manda en la UI.
      if (miTurno !== turnoActual) return;
      // reconciliarStreamTruncado() se encarga de reactivar la UI cuando
      // termine: si lo hiciéramos aquí también, el input quedaría utilizable
      // un instante mientras la reconciliación todavía está en vuelo.
      if (reconciliando) return;
      input.disabled = false;
      sendBtn.hidden = false;
      stopBtn.hidden = true;
      input.focus();
    });
  }

  // CV-I3: si el navegador pausa o mata la lectura del stream en segundo
  // plano (pestaña oculta) y el turno seguía activo al volver, no queda
  // otra que reconciliar con la ruta no-streaming — dejar el mensaje
  // truncado sin ninguna señal no es una opción.
  function reconciliarStreamTruncado() {
    var miTurno = turnoActual;
    var textoOriginal = mensajeTurnoActual;
    if (!textoOriginal) return;
    reconciliando = true;
    if (controladorActual) controladorActual.abort();

    apiRequest('POST', '/api/v1/mensajes', { mensaje: textoOriginal, session_id: sessionId }, true)
      .then(function (data) {
        var emocion = data.emocion && data.emocion !== 'ninguna' ? data.emocion : null;
        escribirRespuestaCompleta(miTurno, data.respuesta, emocion);
      })
      .catch(function (err) {
        console.error('No se pudo reconciliar tras volver de segundo plano:', err);
        if (miTurno === turnoActual) {
          mostrarErrorInline('Se perdió la conexión mientras la app estaba en segundo plano. Intenta enviar tu mensaje de nuevo.');
        }
      })
      .then(function () {
        reconciliando = false;
        if (miTurno !== turnoActual) return;
        input.disabled = false;
        sendBtn.hidden = false;
        stopBtn.hidden = true;
      });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (reconciliando) return;
    // stopBtn oculto === 'reposo'/'idle': no hay turno activo que reconciliar.
    if (stopBtn.hidden) return;
    reconciliarStreamTruncado();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !input.disabled && input.value.trim()) {
      var texto = input.value.trim();
      input.value = '';
      enviarMensaje(texto);
    }
  });

  sendBtn.addEventListener('click', function () {
    if (!input.disabled && input.value.trim()) {
      var texto = input.value.trim();
      input.value = '';
      enviarMensaje(texto);
    }
  });

  stopBtn.addEventListener('click', function () {
    if (controladorActual) controladorActual.abort();
  });

  // CV-C3: reiniciar borra el historial de la sesión — es destructivo e
  // irreversible, así que exige confirmación explícita antes de llamar al
  // backend.
  resetBtn.addEventListener('click', function () {
    if (resetBtn.disabled || !sessionId) return;
    var confirmado = window.confirm('¿Reiniciar la conversación? Se perderá el historial actual y no se puede deshacer.');
    if (!confirmado) return;

    turnoActual += 1;
    if (controladorActual) controladorActual.abort();
    input.disabled = true;
    sendBtn.hidden = false;
    sendBtn.disabled = true;
    stopBtn.hidden = true;
    resetBtn.disabled = true;

    apiRequest('POST', '/api/v1/sesiones/' + encodeURIComponent(sessionId) + '/reiniciar', undefined, true)
      .then(function () {
        messagesEl.innerHTML = '';
        crearMensajeWelcome('reinicio');
      })
      .catch(function (err) {
        console.error('No se pudo reiniciar la sesión:', err);
        mostrarErrorInline('No se pudo reiniciar la conversación. Intenta de nuevo.');
      })
      .then(function () {
        resetBtn.disabled = false;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      });
  });

  bootstrap();
</script>



</body></html>
